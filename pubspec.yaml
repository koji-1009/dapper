name: dapper
description: A simple Markdown and YAML formatter for Dart, inspired by Prettier.
version: 1.6.0
repository: https://github.com/koji-1009/dapper
issue_tracker: https://github.com/koji-1009/dapper/issues
topics:
  - formatter
  - markdown
  - yaml
  - cli

executables:
  dapper: dapper

environment:
  sdk: ^3.8.0

dependencies:
  args: ^2.7.0
  glob: ^2.2.0
  markdown: ^7.3.0
  stack_trace: ^1.12.2
  yaml: ^3.1.3

dev_dependencies:
  build_runner: ^2.16.1
  build_version: ^2.1.3
  coverage: ^1.15.0
  lints: ^6.0.0
  path: ^1.9.1
  test: ^1.25.6
  test_descriptor: ^2.0.2
  test_process: ^2.1.1
